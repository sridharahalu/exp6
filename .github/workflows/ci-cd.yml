name: Python CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # Speeds up subsequent runs by caching dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov bandit

    - name: Lint code (Quality Check)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. Remove --exit-zero to enforce style.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Security scan (Bandit)
      run: |
        bandit -r . -ll # Scans for common security issues

    - name: Run tests with coverage
      run: |
        pytest --cov=app --cov-report=term --cov-fail-under=80

    - name: Validate script output
      run: |
        # We capture the output and use a grep check to be more resilient to logs/warnings
        output=$(python app.py)
        echo "Script output: $output"
        if [[ "$output" != "5" ]]; then
          echo "Error: Expected output 5, but got $output"
          exit 1
        fi

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    # Only deploy if the trigger was a push to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Deploy Application
      run: |
        echo "Deploying application to production..."
        # Add your actual deployment commands here (e.g., AWS, Heroku, Docker)

    - name: Post-deployment validation
      run: echo "Deployment successful and verified!"
